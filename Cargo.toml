[package]
name = "IMGT_StatAssembly"
description = "Assess quality of assemblies and allele confidence on IG and TR loci"
version = "2.1.0"
edition = "2024"
authors = ["Guilhem Zeitoun <guilhem.zeitoun@cnrs.fr>", "IMGT® <contact-imgt@igh.cnrs.fr>"]
rust-version = "1.93"
license = "EUPL-1.2"
keywords = ["immunogenetics", "reads", "assembly quality"]
publish = false
categories = ["science::bioinformatics::sequence-analysis"]
[dependencies]
bio-types = "1.0.4"
bzip2-sys = { version = "0.1.13", features = ["static"] }
clap = { version = "4.6.7", features = ["derive", "cargo"] }
csv = "1.4.0"
itertools = "0.15.0"
#noodles-core = "0.15.0"
#noodles-fasta = "0.46.0"
num-format = "0.4.4"
openssl-sys = { version = "0.9.117", features = ["vendored"] }
ordered-float = "5.4.0"
plotters = { version = "0.3.7", features = ["all_series","bitmap_backend"] }
ranges = "0.4.0"
extended-htslib = { version = "*", features = ["bzip2","curl","lzma","static"] }
#extended-htslib = { git = "https://src.koda.cnrs.fr/imgt-igh/extended-rustlib.git", features = ["bzip2","curl","lzma","static"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
lazy_static = "1.5.1"
regex = "1.13.1"
bio = "4.2.2"
flate2 = "1.1.10"
reqwest = { version = "0.13.5", features = ["blocking", "multipart", "query", "json","http3"] }
tempfile = "3.27.0"
tar = "0.4.46"
webbrowser = "1.2.4"
strum = { version = "0.28.0", features = ["strum_macros"] }
strum_macros = "0.28.0"
serde_with = "3.24.0"
quick-xml = "0.42.0"
indicatif = "0.18.6"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
rammap-core = { version = "1.1.3", default-features = false, features = ["parallel"] }
oxidize-pdf = { version = "5.4.2", optional = true }
rayon = "1.12.0"
semver = "1.0.28"
[lints.rust]
unsafe_code = "deny"
[profile.release]
opt-level = 3       # Max optimization
lto = true          # Link-Time Optimization
codegen-units = 1   # Better optimization, slower compile
panic = "abort"     # Reduce binary size by aborting on panic
strip = true        # Automatically strip symbols (Rust 1.59+)
[package.metadata.appimage]
assets = ["images"]
icon = "images/logo_software.png"
desktop_entry = "other/myapp.desktop"
auto_link = true
auto_link_exclude_list = [
    "libc.so*",
    "libdl.so*",
    "libpthread.so*",
]
[features]
default = ["pileup"]
pdf = ["dep:oxidize-pdf"]
pileup = ["extended-htslib/pileuprayon"]
