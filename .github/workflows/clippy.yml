on: push
name: Clippy check

# Make sure CI fails on all warnings, including Clippy lints
env:
  RUSTFLAGS: "-Dwarnings --cfg reqwest_unstable"

permissions:
  contents: read

jobs:
  clippy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
            sudo apt-get update
            sudo apt-get -y install \
              libfontconfig1-dev \
              libharfbuzz-dev \
              libtiff-dev \
              libconfig++-dev \
              libconfig-dev
      - name: Run Clippy
        run: git lfs pull && cargo clippy --all-targets --all-features && cargo test --release --all-targets --all-features
