
name: Push master to external repository

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to self-hosted GitLab
        env:
          EXTERNAL_REPO_URL: ${{ secrets.EXTERNAL_REPO_URL }}
          EXTERNAL_REPO_TOKEN: ${{ secrets.EXTERNAL_REPO_TOKEN }}
        run: |
          set -e
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add external "$EXTERNAL_REPO_URL"

          AUTH=$(printf 'oauth2:%s' "$EXTERNAL_REPO_TOKEN" | base64 -w0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push external HEAD:refs/heads/master

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push external --tags
