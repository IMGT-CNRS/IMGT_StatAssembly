
name: Push master to external repository

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to external repository
        env:
          EXTERNAL_REPO_URL: ${{ secrets.EXTERNAL_REPO_URL }}
          EXTERNAL_REPO_TOKEN: ${{ secrets.EXTERNAL_REPO_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add external "https://x-access-token:${EXTERNAL_REPO_TOKEN}@${EXTERNAL_REPO_URL#https://}"

          git push external HEAD:master
          git push external --tags
